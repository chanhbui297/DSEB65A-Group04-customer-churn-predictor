name: Model Training Pipeline (CT)

# Trigger the workflow on manual dispatch or code changes in models/data
on:
  workflow_dispatch:
  push:
    paths:
      - "src/models/**"
      - "data/**"
      - "config/**"

jobs:
  train-and-log:
    name: Continuous Training with MLflow & DVC
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Set up uv (cached) and install dependencies including DVC
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv pip install . dvc[s3] --system

      # 4. Authenticate DVC and pull data from DagsHub
      - name: Pull Data from DVC Remote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_SECRET_ACCESS_KEY }}
          DAGSHUB_S3_ENDPOINT_URL: ${{ secrets.DAGSHUB_S3_ENDPOINT_URL }}
        run: |
          # Configure runner-local DVC remote credentials and endpoint
          dvc remote modify origin --local access_key_id $AWS_ACCESS_KEY_ID
          dvc remote modify origin --local secret_access_key $AWS_SECRET_ACCESS_KEY
          dvc remote modify origin --local endpointurl $DAGSHUB_S3_ENDPOINT_URL

          # Pull training data tracked by DVC
          dvc pull ${{ env.DATA_PATH }}.dvc || echo "Warning: DVC pull failed"

      # 5. Install Python dependencies defined in pyproject.toml
      - name: Install Dependencies
        run: uv sync --system --no-dev

      # 6. Run the training script and log results to DagsHub MLflow
      - name: Execute Training Script
        env:
          # Remote MLflow tracking configuration for DagsHub
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ github.repository }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ github.actor }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Use n_iter=2 to prevent the GitHub Runner from timing out during hyperparameter search
          python src/models/train_model.py \
            --data data/raw/train.csv \
            --model_dir models \
            --n_iter 2

      # 7. Upload the trained model and baseline stats as CI artifacts
      - name: Upload Training Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-run-artifacts
          path: |
            models/model.pkl
            models/baseline_stats.json
            models/LATEST_VERSION.txt